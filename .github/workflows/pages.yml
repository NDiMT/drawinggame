name: Deploy to GitHub Pages

# Publishes the static site. No build step — the app is plain HTML/CSS/ESM JS.
on:
  push:
    branches:
      - claude/multiplayer-webrtc-game-fl3ax3
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Enable Pages (GitHub Actions build type) automatically on first run,
          # so no manual Settings → Pages step is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
