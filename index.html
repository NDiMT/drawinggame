<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <title>Tinaftore — γράψε, ζωγράφισε, μάντεψε!</title>
  <link rel="canonical" href="https://tinaftore.com/" />
  <script>
    // Κανονικοποίηση host: www -> σκέτο tinaftore.com (εκτός από το GitHub redirect).
    if (location.hostname === "www.tinaftore.com") {
      location.replace("https://tinaftore.com" + location.pathname + location.search + location.hash);
    }
  </script>
  <meta name="description" content="Tinaftore: το party παιχνίδι όπου γράφεις μια φράση, κάποιος τη ζωγραφίζει, κάποιος άλλος μαντεύει τι είναι. Φτιάξε δωμάτιο, μοίρασε τον 6ψήφιο κωδικό, παίξτε από το κινητό." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&display=swap&subset=greek,greek-ext,latin" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=13" />
  <link rel="icon" href="./assets/logo.png?v=2" />
  <link rel="apple-touch-icon" href="./assets/logo.png?v=2" />
</head>
<body>
  <div id="bg-dots" aria-hidden="true"></div>
  <div id="doodles" aria-hidden="true">
    <span class="dd d1">⭐</span>
    <span class="dd d2">✏️</span>
    <span class="dd d3">✨</span>
    <span class="dd d4">🎨</span>
    <span class="dd d5">💬</span>
    <span class="dd d6">❓</span>
    <span class="dd d7">🌟</span>
    <span class="dd d8">〽️</span>
  </div>
  <div id="status" class="status-pill" hidden></div>
  <main id="app"></main>

  <!-- Το PeerJS χειρίζεται μόνο το WebRTC handshake (δωρεάν public broker). -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="./js/main.js?v=13"></script>
</body>
</html>
