<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <title>Doodle Relay — draw-and-guess party game</title>
  <meta name="description" content="A peer-to-peer write / draw / guess party game. Create a room, share the 6-digit code, play on any phone." />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>" />
</head>
<body>
  <div id="bg-blobs" aria-hidden="true"></div>
  <main id="app"></main>
  <footer class="app-footer">Doodle Relay · peer-to-peer, no servers · built for mobile</footer>

  <!-- PeerJS handles only the WebRTC connection handshake (free public broker).
       Game data flows directly peer-to-peer; the host browser is authoritative. -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
